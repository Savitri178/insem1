
<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
</head>
<body style="background-color: lightgreen; text-align: center;
             font-family: Arial; padding-top: 100px;">

    <h1>Student Dashboard</h1>
    <h2 id="welcome"></h2>
    <p>Welcome to the College Student Portal!</p>

    <button onclick="logout()">Logout</button>

    <script>
        var user = JSON.parse(
            localStorage.getItem("loginDetails") || "null"
        );

        if (!user || user.role !== "student") {
            window.location.href = "login.html";
        } else {
            document.getElementById("welcome").innerText =
                "Login Successfully as Student: " + user.username;
        }

        function logout() {
            localStorage.removeItem("loginDetails");
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
